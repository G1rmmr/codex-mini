[package]
name = "codex-mini"
version = "0.1.0"
edition = "2024"
description = "A small, event-driven native GUI for the installed Codex CLI"
license = "MIT"

[dependencies]
eframe = { version = "=0.35.0", default-features = false, features = ["default_fonts", "glow", "x11"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
toml_edit = "=0.22.27"

[features]
wayland = ["eframe/wayland"]

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
debug = 0


[dev-dependencies]
egui_kittest = { version = "=0.35.0", default-features = false }
