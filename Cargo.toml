[package]
name = "codex-mini"
version = "0.1.0"
edition = "2024"
description = "A small, event-driven native GUI for the installed Codex CLI"
license = "MIT"
rust-version = "1.92"

[dependencies]
eframe = { version = "=0.35.0", default-features = false, features = ["default_fonts", "glow", "x11"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = "=0.22.27"
tray-icon = { version = "=0.25.1", default-features = false, features = ["ksni"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "=5.19.0", default-features = false, features = ["async-io", "blocking-api"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Console", "Win32_UI_Shell"] }

[features]
ui-review = ["egui_kittest/wgpu", "egui_kittest/snapshot"]
wayland = ["eframe/wayland"]

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
debug = 0


[dev-dependencies]
egui_kittest = { version = "=0.35.0", default-features = false }
