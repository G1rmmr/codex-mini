name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check version and release ancestry
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          test "$TAG" = "v$version"
          git merge-base --is-ancestor HEAD origin/main
  build:
    needs: version
    uses: ./.github/workflows/build.yml
  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: codex-mini-*
          path: release
          merge-multiple: true
      - name: Publish archives and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          cd release
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 4
          sha256sum codex-mini-* > SHA256SUMS
          gh release create "$TAG" codex-mini-* SHA256SUMS --verify-tag --title "$TAG" --generate-notes
